<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilim Sinovi — Online testlar va sertifikatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#14213D;
    --ink-fill:#14213D;
    --slate:#3B4A6B;
    --parchment:#F7F2E7;
    --brass:#A9822C;
    --brass-light:#C9A855;
    --canvas:#FDFBF6;
    --surface:#FFFFFF;
    --text:#262220;
    --text-soft:#5B564E;
    --success:#3F6B4F;
    --error:#9B4630;
    --line:#DCD3BF;
  }
  :root[data-theme="dark"]{
    --ink:#8CA0D9;
    --ink-fill:#33488A;
    --brass:#D9BB74;
    --canvas:#1B1D21;
    --surface:#232529;
    --text:#E8E4DA;
    --text-soft:#A6A196;
    --line:#3A3B3D;
    --success:#4FA374;
    --error:#C15A42;
  }
  :root{
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-pill:999px;
    --shadow-sm:0 2px 10px rgba(20,33,61,.06);
    --shadow-md:0 10px 30px rgba(20,33,61,.10);
    --shadow-lg:0 18px 46px rgba(20,33,61,.14);
    --navy:#101C36;
    --navy-2:#16264A;
  }
  :root, body{
    transition:background .2s ease, color .2s ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces', serif;
    color:var(--ink);
    margin:0;
  }
  button{
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    border:none;
    background:none;
  }
  input{
    font-family:'IBM Plex Sans', sans-serif;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- layout shell ---------- */
  .app{
    max-width:960px;
    margin:0 auto;
    padding:0 24px 80px;
  }
  .topbar{
    background:var(--navy);
    padding:16px 24px;
  }
  .topbar-inner{
    display:flex;
    align-items:center;
    gap:20px;
    max-width:960px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-mark{
    width:32px;height:32px;
    border-radius:var(--radius-sm);
    background:var(--brass);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:15px;
    color:var(--navy);
    flex:none;
  }
  .brand-name{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    color:#fff;
    letter-spacing:0.2px;
  }
  .brand-tag{
    font-size:13px;
    color:#AEB6C9;
    border-left:1px solid rgba(255,255,255,.18);
    padding-left:12px;
  }

  .screen{
    animation: rise .38s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- home ---------- */
  .intro{
    padding:48px 0 16px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .intro h1{
    font-size:34px;
    font-weight:600;
    max-width:560px;
    line-height:1.2;
  }
  .intro p{
    color:var(--text-soft);
    max-width:480px;
    margin-top:14px;
    font-size:15.5px;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .section-head h2{
    font-size:20px;
    font-weight:600;
  }
  .section-head span{
    font-size:13px;
    color:var(--text-soft);
  }

  .test-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
    margin-bottom:44px;
  }
  @media (max-width:620px){ .test-grid{grid-template-columns:1fr;} }

  .test-card{
    position:relative;
    border-radius:var(--radius-lg);
    background:var(--surface);
    box-shadow:var(--shadow-sm);
    text-align:left;
    padding:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .test-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow-lg);
  }
  .test-card-header{
    height:110px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .test-card-header .glyph{
    font-size:32px;
    font-weight:700;
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .test-card-arrow{
    position:absolute;
    top:12px; right:12px;
    width:32px; height:32px;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:700;
  }
  .test-card-body{
    padding:18px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:9px;
    flex:1;
  }
  .test-cat{
    font-size:12px;
    font-weight:700;
  }
  .test-card h3{
    font-size:18.5px;
    font-weight:600;
    line-height:1.3;
  }
  .test-desc{
    font-size:13.3px;
    color:var(--text-soft);
    line-height:1.5;
  }
  .test-rating{
    font-size:12px;
    color:var(--text-soft);
  }
  .test-rating .tr-stars{color:var(--brass); font-weight:700;}
  .test-rating .tr-sub{color:var(--text-soft);}
  .test-rating .tr-loading{color:var(--text-soft); font-style:italic;}
  .test-meta{
    display:flex;
    gap:14px;
    font-size:12.5px;
    color:var(--text-soft);
  }
  .test-cta{
    margin-top:10px;
    border-radius:var(--radius-pill);
    padding:10px 18px;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    text-align:center;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .test-cta:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}

  .results-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .result-row{
    background:var(--surface);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14.5px;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);
  }
  .result-row .name{font-weight:600;}
  .result-row .sub{color:var(--text-soft); font-size:13px; margin-top:2px;}
  .badge{
    font-size:12.5px;
    font-weight:600;
    padding:4px 12px;
    border-radius:var(--radius-pill);
    border:1px solid;
  }
  .badge.pass{color:var(--success); border-color:var(--success);}
  .badge.fail{color:var(--error); border-color:var(--error);}

  .empty-note{
    color:var(--text-soft);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:var(--radius-md);
    padding:16px;
    margin-bottom:20px;
  }

  /* ---------- quiz ---------- */
  .quiz-wrap{
    max-width:640px;
    margin:0 auto;
    padding-top:36px;
  }
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .quiz-head h2{font-size:19px; font-weight:600;}
  .timer{
    font-family:'Fraunces', serif;
    font-size:19px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .timer.low{color:var(--error);}
  .progress-track{
    height:6px;
    border-radius:var(--radius-pill);
    background:var(--line);
    margin-bottom:34px;
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--brass);
    transition:width .3s ease;
  }
  .q-count{
    font-size:13px;
    color:var(--text-soft);
    margin-bottom:8px;
  }
  .q-text{
    font-size:23px;
    font-weight:500;
    line-height:1.4;
    margin-bottom:28px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:32px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:14px;
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    text-align:left;
    font-size:15.5px;
    background:var(--surface);
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover{border-color:var(--slate);}
  .option .letter{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
  }
  .option.selected{
    border-color:var(--ink);
    background:var(--parchment);
  }
  .option.selected .letter{
    background:var(--ink-fill);
    color:#fff;
  }
  .option.correct{border-color:var(--success); background:#F2F7F3;}
  .option.correct .letter{background:var(--success); border-color:var(--success); color:#fff;}
  .option.wrong{border-color:var(--error); background:#FBF2EF;}
  .option.wrong .letter{background:var(--error); border-color:var(--error); color:#fff;}

  .quiz-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .btn{
    padding:12px 26px;
    font-size:14.5px;
    font-weight:600;
    border:1.5px solid var(--ink);
    color:var(--ink);
    background:var(--surface);
    border-radius:var(--radius-pill);
    box-shadow:var(--shadow-sm);
    transition:background .15s ease, color .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .btn:hover{background:var(--ink-fill); color:#fff; transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .btn.primary{background:var(--brass); color:var(--navy); border-color:var(--brass); box-shadow:var(--shadow-md);}
  .btn.primary:hover{background:var(--brass-light); border-color:var(--brass-light); color:var(--navy);}
  .btn.brass{border-color:var(--brass); color:var(--brass);}
  .btn.brass:hover{background:var(--brass); color:#fff;}
  [data-theme="dark"] .btn.brass:hover{color:#1B1D21;}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
  .btn:disabled:hover{background:var(--surface); color:var(--ink); transform:none; box-shadow:var(--shadow-sm);}
  .btn-ghost{
    font-size:14px;
    color:var(--text-soft);
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---------- result ---------- */
  .result-wrap{
    max-width:560px;
    margin:0 auto;
    padding-top:44px;
    text-align:center;
  }
  .score-ring{
    width:150px;height:150px;
    border-radius:50%;
    border:3px solid var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin:0 auto 26px;
  }
  .score-ring .num{
    font-family:'Fraunces', serif;
    font-size:38px;
    font-weight:600;
    color:var(--ink);
  }
  .score-ring .lbl{
    font-size:12px;
    color:var(--text-soft);
    margin-top:2px;
  }
  .result-wrap.fail .score-ring{border-color:var(--error);}
  .result-wrap.fail .score-ring .num{color:var(--error);}
  .result-verdict{
    font-size:16px;
    margin-bottom:6px;
  }
  .result-xp{
    display:inline-block;
    font-size:13.5px;
    font-weight:600;
    color:var(--brass);
    background:var(--parchment);
    border-radius:var(--radius-pill);
    padding:7px 16px;
    margin-bottom:10px;
  }
  .result-wrap p.hint{
    color:var(--text-soft);
    font-size:14.5px;
    margin-bottom:32px;
  }
  .result-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:40px;
    flex-wrap:wrap;
  }
  .review{
    text-align:left;
    border-top:1px solid var(--line);
    padding-top:24px;
  }
  .review h3{font-size:16px; margin-bottom:14px;}
  .review-item{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .review-item .q{font-weight:500; margin-bottom:6px;}
  .review-item .a{color:var(--text-soft); font-size:13.5px;}
  .review-item .a.wrong{color:var(--error);}
  .review-item .a.right{color:var(--success);}

  /* ---------- certificate ---------- */
  .cert-wrap{
    max-width:760px;
    margin:0 auto;
    padding-top:36px;
  }
  .cert-form{
    display:flex;
    gap:10px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .cert-form input{
    flex:1;
    min-width:220px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    font-size:15px;
    background:var(--surface);
  }
  .cert-form input:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);}

  .certificate{
    --ink:#14213D;
    --ink-fill:#14213D;
    --brass:#A9822C;
    --text:#262220;
    --text-soft:#5B564E;
    --line:#DCD3BF;
    --success:#3F6B4F;
    --error:#9B4630;
    background:var(--parchment);
    border:2px solid var(--ink);
    padding:8px;
    position:relative;
  }
  .certificate-inner{
    border:1px solid var(--brass);
    padding:52px 48px 40px;
    position:relative;
    text-align:center;
  }
  .certificate-inner::before, .certificate-inner::after{
    content:"";
    position:absolute;
    width:22px;height:22px;
    border-top:2px solid var(--brass);
    border-left:2px solid var(--brass);
    top:8px;left:8px;
  }
  .certificate-inner::after{
    top:auto;left:auto;bottom:8px;right:8px;
    border-top:none;border-left:none;
    border-bottom:2px solid var(--brass);
    border-right:2px solid var(--brass);
  }
  .cert-eyebrow{
    font-size:13px;
    color:var(--brass);
    font-weight:600;
    letter-spacing:0.5px;
  }
  .cert-title{
    font-size:38px;
    font-weight:600;
    color:var(--ink);
    margin:10px 0 26px;
  }
  .cert-sub{
    font-size:14.5px;
    color:var(--text-soft);
  }
  .cert-name{
    font-family:'Fraunces', serif;
    font-size:32px;
    font-weight:500;
    color:var(--ink);
    margin:14px 0;
    border-bottom:1px solid var(--brass);
    display:inline-block;
    padding-bottom:8px;
    min-width:280px;
  }
  .cert-body{
    font-size:15px;
    color:var(--text);
    max-width:480px;
    margin:0 auto 30px;
    line-height:1.7;
  }
  .cert-body b{color:var(--ink);}
  .cert-footer{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:30px;
    text-align:left;
  }
  .cert-seal{
    flex:none;
  }
  .cert-id{
    font-size:12px;
    color:var(--text-soft);
  }
  .cert-date{
    font-size:13px;
    color:var(--text-soft);
    text-align:right;
  }
  .cert-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:30px;
  }

  @media print{
    .topbar, .cert-form, .cert-actions, .btn-ghost{display:none !important;}
    .app{padding:0; max-width:none;}
    body{background:#fff;}
  }

  .footer-note{
    text-align:center;
    color:var(--text-soft);
    font-size:12.5px;
    margin-top:50px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }

  /* ---------- auth ---------- */
  .loading-wrap{
    max-width:400px;
    margin:120px auto;
    text-align:center;
    color:var(--text-soft);
    font-size:14.5px;
  }
  .auth-wrap{
    max-width:420px;
    margin:0 auto;
    padding-top:52px;
  }
  .auth-head{
    text-align:center;
    margin-bottom:30px;
  }
  .auth-head h1{
    font-size:27px;
    font-weight:600;
  }
  .auth-head p{
    color:var(--text-soft);
    font-size:14.5px;
    margin-top:10px;
  }
  .auth-tabs{
    display:flex;
    border:1px solid var(--ink);
    border-radius:var(--radius-pill);
    overflow:hidden;
    margin-bottom:26px;
  }
  .auth-tab{
    flex:1;
    padding:12px;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    background:var(--surface);
    text-align:center;
  }
  .auth-tab.active{
    background:var(--ink-fill);
    color:#fff;
  }
  .auth-card{
    border-radius:var(--radius-lg);
    background:var(--surface);
    box-shadow:var(--shadow-md);
    padding:30px 26px;
    position:relative;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-soft);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    font-size:15px;
    background:var(--surface);
  }
  .field input:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
    border-color:var(--brass);
  }
  .auth-error{
    color:var(--error);
    font-size:13.5px;
    margin-bottom:16px;
    border:1px solid var(--error);
    padding:10px 12px;
  }
  .auth-submit{
    width:100%;
    padding:13px;
    margin-top:6px;
  }
  .user-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border:1px solid var(--line);
    background:var(--surface);
    margin-bottom:28px;
    font-size:14px;
  }
  .user-bar .who b{color:var(--ink);}
  .user-bar .who span{color:var(--text-soft); font-size:12.5px; display:block; margin-top:2px;}

  .topnav{
    display:flex;
    align-items:center;
    gap:20px;
    border-left:1px solid var(--line);
    padding-left:14px;
  }
  .topnav-link{
    font-size:13px;
    color:var(--text-soft);
    padding-bottom:3px;
    border-bottom:2px solid transparent;
  }
  .topnav-link:hover{color:var(--ink);}
  .topnav-link.active{
    color:var(--ink);
    font-weight:600;
    border-bottom-color:var(--brass);
  }

  /* ---------- profile ---------- */
  .profile-wrap{
    max-width:640px;
    margin:0 auto;
    padding-top:36px;
  }
  .profile-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .profile-head h1{
    font-size:26px;
    font-weight:600;
  }
  .profile-head .login-line{
    color:var(--text-soft);
    font-size:13.5px;
    margin-top:6px;
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    margin-bottom:36px;
  }
  .stat-box{
    background:var(--surface);
    padding:18px 16px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .stat-box:last-child{border-right:none;}
  .stat-box .n{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    color:var(--ink);
  }
  .stat-box .l{
    font-size:12.5px;
    color:var(--text-soft);

  .notif-btn{

  /* ---------- mascot ---------- */
  .mascot-wrap{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:150;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
    pointer-events:none;
  }
  .mascot-bot{
    width:64px;
    height:64px;
    animation:mascotJump 1.6s ease-in-out infinite;
    cursor:grab;
    pointer-events:auto;
    touch-action:none;
    transform-origin:50% 100%;
  }
  .mascot-bot svg{width:100%; height:100%; display:block;}
  @keyframes mascotJump{
    0%{ transform:translateY(0) scale(1,1) rotate(-2deg); }
    12%{ transform:translateY(2px) scale(1.08,0.86) rotate(-2deg); }
    38%{ transform:translateY(-24px) scale(0.95,1.08) rotate(2deg); }
    55%{ transform:translateY(-24px) scale(0.95,1.08) rotate(3deg); }
    75%{ transform:translateY(1px) scale(1.06,0.9) rotate(-1deg); }
    100%{ transform:translateY(0) scale(1,1) rotate(-2deg); }
  }
  .mascot-bot.grabbed{
    animation:mascotWiggle .28s ease-in-out infinite;
    cursor:grabbing;
  }
  @keyframes mascotWiggle{
    0%,100%{ transform:rotate(-9deg) scale(1.06); }
    50%{ transform:rotate(9deg) scale(1.06); }
  }
  .mascot-bot.landed{
    animation:mascotLand .35s ease;
  }
  @keyframes mascotLand{
    0%{ transform:scale(1.15,0.75); }
    55%{ transform:scale(0.9,1.15); }
    100%{ transform:scale(1,1); }
  }

    font-weight:600;
    padding:9px 14px;

    box-shadow:var(--shadow-md);
    position:relative;
    opacity:0;
    transform:translateY(6px) scale(.94);
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .mascot-bubble::after{
    content:"";
    position:absolute;
    bottom:-6px; right:22px;
    width:12px; height:12px;
    background:var(--surface);
    transform:rotate(45deg);
  }
  .mascot-bubble.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .mascot-info-card{

  const obj = {};

/* ---------------- online holati (heartbeat) ---------------- */
const HEARTBEAT_INTERVAL_MS = 45000;
const ONLINE_THRESHOLD_MS = 90000;
let heartbeatTimer = null;

function sendHeartbeat(username){
  db.collection("accounts").doc(username).set(
    {lastActive: firebase.firestore.FieldValue.serverTimestamp()},
    {merge:true}
  ).catch(e=>console.error("Heartbeat xatosi:", e));
}
function startHeartbeat(username){
  sendHeartbeat(username);
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(()=>sendHeartbeat(username), HEARTBEAT_INTERVAL_MS);
}
function stopHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}
function toJsDate(ts){
  if(!ts) return null;
  if(typeof ts.toDate === "function") return ts.toDate();
  if(ts.seconds) return new Date(ts.seconds*1000);
  return null;
}
function isUserOnline(a){
  const d = toJsDate(a && a.lastActive);
  if(!d) return false;
  return (Date.now() - d.getTime()) < ONLINE_THRESHOLD_MS;
}

function startDmConversationsWatcher(){
  if(state.dmConversationsUnsub) return;
  state.dmConversationsUnsub = db.collection("conversations")
    .where("participants","array-contains", state.currentUser)
    .onSnapshot(snap=>{
      const list = [];
      snap.forEach(doc=>{
        const d = doc.data();
        const peer = (d.participants||[]).find(p=>p!==state.currentUser);
        if(!peer) return;
        const readAt = (d.readBy && d.readBy[state.currentUser]) ? toJsDate(d.readBy[state.currentUser]) : null;
        const lastAt = toJsDate(d.lastMessageAt);
        const unread = !!(d.lastSender && d.lastSender!==state.currentUser && lastAt && (!readAt || lastAt.getTime()>readAt.getTime()));
        list.push({
          id: doc.id,
          peerUsername: peer,
          peerName: (state.accounts[peer] && state.accounts[peer].fullName) || peer,
          lastMessage: d.lastMessage || "",
          lastMessageAt: lastAt,
          unread
        });
      });
      list.sort((a,b)=>(b.lastMessageAt?b.lastMessageAt.getTime():0) - (a.lastMessageAt?a.lastMessageAt.getTime():0));
      state.dmConversations = list;
      state.dmUnreadCount = list.filter(c=>c.unread).length;
      if(document.getElementById("topbarRight")) renderTopbar();
    }, e=>console.error("Suhbatlarni kuzatishda xatolik:", e));
}
function stopDmConversationsWatcher(){
  if(state.dmConversationsUnsub){ state.dmConversationsUnsub(); state.dmConversationsUnsub = null; }
  state.dmConversations = [];
  state.dmUnreadCount = 0;
}

function formatDuration(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds||0));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(h>0) return h + " soat " + m + " daq";
  if(m>0) return m + " daq " + sec + " son";
  return sec + " soniya";
}

async function loadTheme(){
  try{
    const res = await window.storage.get("theme", false);
    return res && res.value ? res.value : "light";
  }catch(e){ return "light"; }
}
async function saveTheme(theme){
  try{ await window.storage.set("theme", theme, false); }catch(e){}
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  state.theme = theme;
}
function toggleTheme(){
  const next = state.theme==="dark" ? "light" : "dark";
  applyTheme(next);
  saveTheme(next);
  render();
}

/* ---------------- storage ---------------- */
async function init(){
  render(); // shows loading
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      const username = user.email.split("@")[0];
      const accountsSnapshot = await fetchAllAccounts();

      if(accountsSnapshot[username] && accountsSnapshot[username].blocked){
        state.currentUser = null;
        state.accounts = accountsSnapshot;
        state.screen = "auth";
        state.authError = "Hisobingiz administrator tomonidan bloklangan.";
        render();
        auth.signOut();
        return;
      }

      state.currentUser = username;
      state.accounts = accountsSnapshot;
      if(!state.accounts[username]){
        state.accounts[username] = {fullName:username, role:null, results:[]};
      }
      state.screen = "home";
      db.collection("accounts").doc(username).set(
        {lastLogin: firebase.firestore.FieldValue.serverTimestamp()},
        {merge:true}
      ).catch(e=>console.error("Oxirgi kirish vaqtini yozishda xatolik:", e));
      startHeartbeat(username);
      startDmConversationsWatcher();
    } else {
      state.currentUser = null;
      state.accounts = await fetchAllAccounts();
      state.screen = "auth";
      stopHeartbeat();
      stopDmConversationsWatcher();
    }
    render();
    if(user) setTimeout(showWelcomeBubble, 300);
  });
}

const app = document.getElementById("app");

function render(){
  if(state._lastScreen==="chatroom" && state.screen!=="chatroom"){ leaveChatRoom(); }
  if(state._lastScreen==="dm_chat" && state.screen!=="dm_chat"){ detachDmListener(); }
  state._lastScreen = state.screen;

  renderTopbar();
  if(state.screen==="loading") renderLoading();
  else if(state.screen==="auth") renderAuth();
  else if(state.screen==="home") renderHome();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="result") renderResult();
  else if(state.screen==="certificate") renderCertificate();
  else if(state.screen==="profile") renderProfile();
  else if(state.screen==="certificates") renderCertificatesPage();
  else if(state.screen==="leaderboard") renderLeaderboardPage();
  else if(state.screen==="reviews") renderReviewsPage();
  else if(state.screen==="duel_lobby") renderDuelLobby();
  else if(state.screen==="duel_arena") renderDuelArena();
  else if(state.screen==="duel_result") renderDuelResult();
  else if(state.screen==="chatroom") renderChatRoom();
  else if(state.screen==="dm_chat") renderDmChat();
}

function initials(name){
  return (name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]?w[0].toUpperCase():"").join("") || "?";
}
function roleLabel(key){
  return {talaba:"Talaba", oqituvchi:"O'qituvchi", oquvchi:"O'quvchi"}[key] || "";
}
function roleColor(key){
  return {talaba:"#2F5FA8", oqituvchi:"#A9822C", oquvchi:"#2F7A5D"}[key] || "#3B4A6B";
}

function renderTopbar(){
  const navEl = document.getElementById("topbarNav");
  const rightEl = document.getElementById("topbarRight");
  if(!navEl || !rightEl) return;

  const loggedInScreens = ["home","quiz","result","certificate","profile","certificates","leaderboard","reviews","duel_lobby","duel_arena","duel_result","chatroom","dm_chat"];
  const isLoggedInArea = state.currentUser && loggedInScreens.includes(state.screen);

  if(isLoggedInArea){
    navEl.innerHTML = `
      <nav class="site-nav">
        <button class="nav-link ${state.screen==='home'?'active':''}" onclick="goHome()">${HOME_ICON}<span>Bosh sahifa</span></button>
        <button class="nav-link ${state.screen==='certificates'?'active':''}" onclick="goCertificatesPage()">${AWARD_ICON}<span>Sertifikatlar</span></button>
        <button class="nav-link ${state.screen==='leaderboard'?'active':''}" onclick="goLeaderboard()">${TROPHY_ICON}<span>Reyting</span></button>
        <button class="nav-link ${state.screen==='reviews'?'active':''}" onclick="goReviews()">${CHAT_ICON}<span>Fikrlar</span></button>
        <button class="nav-link ${state.screen.indexOf('duel')===0?'active':''}" onclick="goDuel()">${DUEL_ICON}<span>Duel</span></button>
        <button class="nav-link ${state.screen==='chatroom'?'active':''}" onclick="goChatRoom()">${CHATROOM_ICON}<span>Chat</span></button>
      </nav>`;
  } else {
    navEl.innerHTML = `<span class="brand-tag">Online testlar va sertifikatlar</span>`;
  }

  let rightHtml = `<button class="theme-toggle-inline" onclick="toggleTheme()" aria-label="Kunduzgi/tungi rejim" title="Kunduzgi/tungi rejim">${state.theme==="dark"?SUN_ICON:MOON_ICON}</button>`;
  if(isLoggedInArea){
    const acc = currentAccount();
    const hasUnread = (acc && acc.results && acc.results.length > (state.notifSeenCount||0)) || (state.dmUnreadCount>0);
    rightHtml += `
      <button class="notif-btn" onclick="openNotifModal()" aria-label="Bildirishnomalar" title="Bildirishnomalar">
        ${BELL_ICON}${hasUnread ? '<span class="notif-dot"></span>' : ''}
      </button>
      <button class="user-chip" onclick="goProfile()">
        <span class="avatar" style="background:${roleColor(acc.role)}">${initials(acc.fullName)}</span>
        <span class="who"><b>${acc.fullName}</b><small>${roleLabel(acc.role)}</small></span>
      </button>`;
  }
  rightEl.innerHTML = rightHtml;

  const mascotWrap = document.getElementById("mascotWrap");
  if(mascotWrap) mascotWrap.style.display = isLoggedInArea ? "flex" : "none";
}

}

function formatLastLogin(ts){
  const d = toJsDate(ts);
  if(!d) return "Hech qachon kirmagan";
  return d.toLocaleString("uz-UZ", {year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}

function buildAdminUserListHtml(search){
  const accounts = state.adminAccounts || {};
  let usernames = Object.keys(accounts).sort();
  const term = (search||"").trim().toLowerCase();
  if(term){
    usernames = usernames.filter(u=>{
      const a = accounts[u];
      return u.toLowerCase().includes(term) || (a.fullName||"").toLowerCase().includes(term);
    });
  }
  if(!usernames.length) return `<div class="empty-note">Hech narsa topilmadi.</div>`;
  return `<div class="admin-user-list">` + usernames.map(u=>{
    const a = accounts[u];
    const st = userStats(a);
    const blocked = !!a.blocked;
    return `<div class="admin-user-row ${blocked?'is-blocked':''}">
      <div class="admin-user-info">
        <b>${a.fullName || u}${blocked ? ' 🚫' : ''}</b>
        <span>${isUserOnline(a) ? '<span style="color:var(--success); font-weight:600;">🟢 Onlayn</span>' : '⚪ Offlayn'} · @${u} · ${roleLabel(a.role) || "—"} · ${st.attemptsCount} urinish · ${st.certCount} sertifikat · ${st.totalXp} XP</span>
        <span>Oxirgi kirish: ${formatLastLogin(a.lastLogin)}</span>
      </div>
      <button class="btn ${blocked?'':'brass'}" style="font-size:12.5px; padding:8px 14px; flex:none;" onclick="toggleBlockUser('${u}', ${!blocked})">${blocked ? "Blokdan chiqarish" : "Bloklash"}</button>
    </div>`;
  }).join("") + `</div>`;
}

function initMascotDrag(){
  const wrap = document.getElementById("mascotWrap");
  const bot = document.getElementById("mascotBot");
  if(!wrap || !bot) return;
  let dragging = false, offsetX = 0, offsetY = 0, startX = 0, startY = 0, moved = 0;

  function getPoint(e){ return e.touches ? e.touches[0] : e; }

  function pointerDown(e){
    dragging = true;
    moved = 0;
    const rect = wrap.getBoundingClientRect();
    const p = getPoint(e);
    startX = p.clientX;
    startY = p.clientY;
    offsetX = p.clientX - rect.left;
    offsetY = p.clientY - rect.top;
    wrap.style.left = rect.left + "px";
    wrap.style.top = rect.top + "px";
    wrap.style.right = "auto";
    wrap.style.bottom = "auto";
    bot.classList.add("grabbed");
    document.addEventListener("mousemove", pointerMove);
    document.addEventListener("touchmove", pointerMove, {passive:false});
    document.addEventListener("mouseup", pointerUp);
    document.addEventListener("touchend", pointerUp);
    e.preventDefault();
  }

  function pointerMove(e){
    if(!dragging) return;
    const p = getPoint(e);
    moved = Math.max(moved, Math.hypot(p.clientX-startX, p.clientY-startY));
    let x = p.clientX - offsetX;
    let y = p.clientY - offsetY;
    x = Math.max(4, Math.min(window.innerWidth - wrap.offsetWidth - 4, x));
    y = Math.max(4, Math.min(window.innerHeight - wrap.offsetHeight - 4, y));
    wrap.style.left = x + "px";
    wrap.style.top = y + "px";
    e.preventDefault();
  }

  function pointerUp(){
    if(!dragging) return;
    dragging = false;
    bot.classList.remove("grabbed");
    bot.classList.add("landed");
    setTimeout(()=>bot.classList.remove("landed"), 380);
    document.removeEventListener("mousemove", pointerMove);
    document.removeEventListener("touchmove", pointerMove);
    document.removeEventListener("mouseup", pointerUp);
    document.removeEventListener("touchend", pointerUp);
    if(moved < 6) openMascotInfo();
  }

  bot.addEventListener("mousedown", pointerDown);
  bot.addEventListener("touchstart", pointerDown, {passive:false});
}
initMascotDrag();

function togglePasswordVisibility(id, btn){
  const input = document.getElementById(id);
  if(!input) return;
  if(input.type==="password"){ input.type="text"; btn.innerHTML = EYE_OFF_ICON; }
  else { input.type="password"; btn.innerHTML = EYE_ICON; }
}

function passwordStrength(pw){
  if(!pw) return {level:"weak", label:""};
  if(pw.length<6) return {level:"weak", label:"Juda oson — yana urinib ko'ring. Kamida 6 belgidan iborat bo'lsin."};
  let score = 0;
  if(pw.length>=10) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  if(score<=1) return {level:"weak", label:"Juda oson — yana urinib ko'ring. Katta-kichik harf va raqamlarni aralashtiring."};
  if(score===2) return {level:"medium", label:"O'rtacha parol. Yanada qiyinroq qilish mumkin."};
  return {level:"strong", label:"Kuchli parol."};
}

async function doSignUp(){
  const fullName = document.getElementById("af_fullname").value.trim();
  const username = document.getElementById("af_username").value.trim().toLowerCase();
  const password = document.getElementById("af_password").value;
  const password2 = document.getElementById("af_password2").value;
  const role = state.authRole;

  if(!fullName || !username || !password){ state.authError = "Barcha maydonlarni to'ldiring."; render(); return; }
  if(!isValidUsername(username)){ state.authError = "Login kamida 3 belgi, faqat lotin harf, raqam va pastki chiziqdan iborat bo'lsin."; render(); return; }
  if(!role){ state.authError = "Iltimos, rolingizni tanlang (Talaba / O'qituvchi / O'quvchi)."; render(); return; }
  const strength = passwordStrength(password);
  if(strength.level==="weak"){ state.authError = strength.label || "Juda oson — yana urinib ko'ring."; render(); return; }
  if(password!==password2){ state.authError = "Parollar mos kelmadi."; render(); return; }

  try{
    await auth.createUserWithEmailAndPassword(usernameToEmail(username), password);
    await db.collection("accounts").doc(username).set({fullName, role, results:[]});
    state.authError = null;
    state.authRole = null;
    // onAuthStateChanged listener handles loading accounts + switching to home
  }catch(e){
    if(e.code==="auth/email-already-in-use"){ state.authError = "Bu login band, boshqa username kiriting."; }
    else if(e.code==="auth/weak-password"){ state.authError = "Parol juda oddiy, kuchliroq parol tanlang."; }
    else if(e.code==="auth/invalid-email"){ state.authError = "Login noto'g'ri formatda."; }
    else{ state.authError = "Xatolik yuz berdi. Qaytadan urinib ko'ring."; console.error(e); }
    render();
  }
}

async function loadTestStats(){
  try{
    const [reviewsSnap, accountsObj] = await Promise.all([
      db.collection("reviews").get(),
      fetchAllAccounts()
    ]);
    const acc = {};
    TESTS.forEach(t=>{ acc[t.id] = {starSum:0, starCount:0, participants:0}; });

    reviewsSnap.forEach(doc=>{
      const d = doc.data();
      if(acc[d.testId] && d.stars){
        acc[d.testId].starSum += d.stars;
        acc[d.testId].starCount += 1;
      }
    });
    Object.values(accountsObj).forEach(a=>{
      const seen = new Set();
      (a.results||[]).forEach(r=>seen.add(r.testId));
      seen.forEach(tid=>{ if(acc[tid]) acc[tid].participants += 1; });
    });

    const stats = {};
    TESTS.forEach(t=>{
      const s = acc[t.id];
      stats[t.id] = {
        avgStars: s.starCount ? (s.starSum/s.starCount) : null,
        reviewCount: s.starCount,
        participants: s.participants
      };
    });
    state.testStats = stats;
  }catch(e){
    console.error("Test statistikasini yuklashda xatolik:", e);
    state.testStats = {};
  }
}

function ensureTestStats(){
  if(state.testStats===null){
    loadTestStats().then(()=>{ if(state.screen==="home") render(); });
  }
}

const DUEL_QUESTION_COUNT = 8;
const DUEL_DURATION_SECONDS = 150;

function buildMixedQuestionPool(count){
  let pool = [];
  TESTS.forEach(t=>{
    t.questions.forEach(q=>{
      pool.push({q:q.q, options:q.options, correct:q.correct, testId:t.id, testTitle:t.title});
    });
  });
  for(let i=pool.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool.slice(0, count);
}

async function createDuel(){
  const acc = currentAccount();
  const questions = buildMixedQuestionPool(DUEL_QUESTION_COUNT);
  try{
    const ref = await db.collection("duels").add({
      player1: state.currentUser,
      player1Name: acc.fullName,
      player2: null,
      player2Name: null,
      status: "waiting",
      questions,
      duration: DUEL_DURATION_SECONDS,
      answers: { [state.currentUser]: new Array(questions.length).fill(null) },
      finishedBy: [],

async function joinDuel(duelId){
  const acc = currentAccount();
  try{
    const ref = db.collection("duels").doc(duelId);
    const doc = await ref.get();
    if(!doc.exists || doc.data().status!=="waiting"){
      alert("Bu duel endi mavjud emas.");
      loadDuelLobby().then(render);
      return;
    }
    const data = doc.data();
    const answers = Object.assign({}, data.answers||{});
    answers[state.currentUser] = new Array(data.questions.length).fill(null);
    await ref.update({
      player2: state.currentUser,
      player2Name: acc.fullName,
      status: "active",
      answers,
      startedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    enterDuel(duelId);
  }catch(e){
    console.error("Duelga qo'shilishda xatolik:", e);
    alert("Qo'shilishda xatolik yuz berdi.");
  }
}

async function cancelDuel(duelId){

  catch(e){ console.error(e); }

}

function enterDuel(duelId){
  detachDuelListener();
  state.duelId = duelId;
  state.duelMyIndex = 0;
  state.duelUnsub = db.collection("duels").doc(duelId)
    .onSnapshot(handleDuelSnapshot, e=>console.error("Duel snapshot xatosi:", e));
}

function handleDuelSnapshot(doc){
  if(!doc.exists){
    detachDuelListener();
    if(state.screen.indexOf("duel")===0) goDuel();
    return;
  }
  const data = {id:doc.id, ...doc.data()};
  state.duelData = data;

  if(data.status==="waiting"){
    state.screen = "duel_lobby";
    render();
  } else if(data.status==="active"){
    state.screen = "duel_arena";
    render();
    ensureDuelTimer(data);
    maybeFinalizeDuel(data, false);
  } else if(data.status==="finished"){
    clearInterval(state.duelTimerHandle);
    const alreadyShown = state.screen==="duel_result";
    state.screen = "duel_result";
    render();
    if(!alreadyShown && data.winner===state.currentUser) launchConfetti();
  }
}

function ensureDuelTimer(data){
  if(state.duelTimerDuelId===data.id && state.duelTimerHandle) { updateDuelTimerDisplay(); return; }
  clearInterval(state.duelTimerHandle);
  state.duelTimerDuelId = data.id;
  const startedDate = toJsDate(data.startedAt);
  if(!startedDate){
    setTimeout(()=>{ if(state.duelData && state.duelData.id===data.id) ensureDuelTimer(state.duelData); }, 500);
    return;
  }
  const endTime = startedDate.getTime() + data.duration*1000;
  function tick(){
    const remaining = Math.max(0, Math.round((endTime-Date.now())/1000));
    state.duelTimeLeft = remaining;
    updateDuelTimerDisplay();
    if(remaining<=0){
      clearInterval(state.duelTimerHandle);
      maybeFinalizeDuel(state.duelData, true);
    }
  }
  tick();
  state.duelTimerHandle = setInterval(tick, 1000);
}

function updateDuelTimerDisplay(){
  const el = document.getElementById("duelTimer");
  if(!el) return;
  const m = Math.floor(state.duelTimeLeft/60);
  const s = state.duelTimeLeft%60;
  el.textContent = `${m}:${s.toString().padStart(2,"0")}`;
  el.classList.toggle("low", state.duelTimeLeft<=20);
}

async function selectDuelAnswer(i){

  const mine = (data.answers && data.answers[state.currentUser] ? data.answers[state.currentUser] : new Array(data.questions.length).fill(null)).slice();
  mine[state.duelMyIndex] = i;
  const answers = Object.assign({}, data.answers||{});
  answers[state.currentUser] = mine;
  data.answers = answers;
  render();
  try{

async function duelSubmitAll(){

  data.finishedBy = finishedBy;
  render();
  try{

      finishedBy: firebase.firestore.FieldValue.arrayUnion(state.currentUser)
    });
    maybeFinalizeDuel(data, false);
  }catch(e){ console.error("Duelni yakunlashda xatolik:", e); }
}

async function maybeFinalizeDuel(data, forceTimeUp){
  if(!data || data.status!=="active") return;
  const players = [data.player1, data.player2].filter(Boolean);
  const bothDone = players.length===2 && players.every(p=>(data.finishedBy||[]).includes(p));
  if(!bothDone && !forceTimeUp) return;

  const scores = {};
  players.forEach(p=>{
    const ans = (data.answers && data.answers[p]) || [];
    let score = 0;
    data.questions.forEach((q,i)=>{ if(ans[i]===q.correct) score++; });
    scores[p] = score;
  });
  let winner = null;
  if(players.length===2){
    const [p1,p2] = players;
    if(scores[p1]>scores[p2]) winner = p1;
    else if(scores[p2]>scores[p1]) winner = p2;
    else winner = "draw";
  }
  try{
    await db.collection("duels").doc(data.id).update({
      status:"finished", scores, winner,
      finishedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error("Duel yakunini saqlashda xatolik:", e); }
}

function launchConfetti(){
  const canvas = document.createElement("canvas");
  canvas.style.position = "fixed";
  canvas.style.inset = "0";
  canvas.style.zIndex = "500";
  canvas.style.pointerEvents = "none";
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const colors = ["#A9822C","#2F5FA8","#2F7A5D","#6A4FA0","#9C6B2E","#B5495B"];
  const pieces = Array.from({length:140}, ()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.3,
    size: 6+Math.random()*6,
    color: colors[Math.floor(Math.random()*colors.length)],
    speedY: 2+Math.random()*3,
    speedX: -2+Math.random()*4,
    rot: Math.random()*360,
    rotSpeed: -8+Math.random()*16
  }));
  let frame = 0;
  function draw(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.speedX; p.y += p.speedY; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    });
    if(frame<220) requestAnimationFrame(draw);
    else canvas.remove();
  }
  draw();
}

  const input = document.getElementById("chatInput");

  const start = input.selectionStart!=null ? input.selectionStart : input.value.length;
  const end = input.selectionEnd!=null ? input.selectionEnd : input.value.length;
  input.value = input.value.slice(0,start) + emoji + input.value.slice(end);

}

function subscribeChatPresenceCount(){
  if(state.chatPresenceUnsub) return;
  state.chatPresenceUnsub = db.collection("chatPresence").onSnapshot(snap=>{
    const now = Date.now();
    const online = [];
    snap.forEach(doc=>{
      const d = toJsDate(doc.data().lastSeen);
      if(d && (now-d.getTime()) < CHAT_PRESENCE_ONLINE_MS){
        online.push({username: doc.id, fullName: doc.data().fullName || doc.id, role: doc.data().role || null});

    state.chatOnlineCount = online.length;

}

function dmConvId(u1, u2){
  return [u1,u2].sort().join("__");
}

function openDmFromProfile(username){
  const cache = state._profileViewCache;
  state.dmTargetUsername = username;
  state.dmTargetName = (cache && cache.username===username) ? cache.fullName : username;
  closeUserProfile();
  closeChatOnlineList();
  goDmChat();
}

function goDmChat(){
  if(!state.dmTargetUsername) { goChatRoom(); return; }
  state.screen = "dm_chat";
  state.dmMessages = [];
  render();
  subscribeDmMessages();
}

function subscribeDmMessages(){
  detachDmListener();
  const convId = dmConvId(state.currentUser, state.dmTargetUsername);
  state.dmConvId = convId;

  function markRead(){
    db.collection("conversations").doc(convId).set({
      participants: [state.currentUser, state.dmTargetUsername].sort(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      readBy: { [state.currentUser]: firebase.firestore.FieldValue.serverTimestamp() }
    }, {merge:true}).catch(e=>console.error("Suhbatni belgilashda xatolik:", e));
  }
  markRead();

  state.dmUnsub = db.collection("conversations").doc(convId).collection("messages")
    .orderBy("createdAt","desc").limit(60)
    .onSnapshot(snap=>{
      state.dmMessages = snap.docs.map(d=>({id:d.id, ...d.data()})).reverse();
      if(state.screen==="dm_chat"){
        renderDmMessages();
        markRead();
      }
    }, e=>console.error("Shaxsiy xabarlarni o'qishda xatolik:", e));
}

function detachDmListener(){
  if(state.dmUnsub){ state.dmUnsub(); state.dmUnsub = null; }
}

function sendDmMessage(){
  const input = document.getElementById("dmInput");
  if(!input || !state.dmConvId) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  const acc = currentAccount();
  const convRef = db.collection("conversations").doc(state.dmConvId);
  convRef.collection("messages").add({
    from: state.currentUser,
    fromName: acc ? acc.fullName : state.currentUser,
    text: text.slice(0,500),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    convRef.set({
      participants: [state.currentUser, state.dmTargetUsername].sort(),
      lastMessage: text.slice(0,120),
      lastMessageAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastSender: state.currentUser
    }, {merge:true});
  }).catch(e=>{
    console.error("Shaxsiy xabar yuborishda xatolik:", e);
    alert("Xabar yuborilmadi.");
  });
}

function startTest(id){
  const test = getTest(id);
  state.testId = id;
  state.qIndex = 0;
  state.answers = new Array(test.questions.length).fill(null);
  state.timeLeft = test.duration*60;
  state.startedAt = Date.now();
  state.reviewStars = 0;
  state.reviewSubmitted = false;
  state.screen = "quiz";
  render();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){
      clearInterval(state.timerHandle);
      finishQuiz();
    } else {
      updateTimerDisplay();
    }
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById("timerDisplay");
  if(!el) return;
  const m = Math.floor(state.timeLeft/60);
  const s = state.timeLeft%60;
  el.textContent = `${m}:${s.toString().padStart(2,"0")}`;
  el.classList.toggle("low", state.timeLeft<=30);
}

function renderQuiz(){
  const test = getTest(state.testId);
  const q = test.questions[state.qIndex];
  const total = test.questions.length;
  const selected = state.answers[state.qIndex];
  const letters = ["A","B","C","D"];

  app.innerHTML = `
  <div class="screen quiz-wrap">
    <div class="quiz-head">
      <h2>${test.title}</h2>
      <span class="timer" id="timerDisplay">--:--</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(state.qIndex/total)*100}%"></div></div>
    <div class="q-count">Savol ${state.qIndex+1} / ${total}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${q.options.map((opt,i)=>`
        <button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">
          <span class="letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>
      `).join("")}
    </div>
    <div class="quiz-nav">
      <button class="btn-ghost" onclick="goHome()">Bekor qilish</button>
      <div style="display:flex; gap:10px;">
        ${state.qIndex>0?`<button class="btn" onclick="prevQuestion()">Orqaga</button>`:""}
        ${state.qIndex<total-1
          ? `<button class="btn primary" ${selected===null?'disabled':''} onclick="nextQuestion()">Keyingisi</button>`
          : `<button class="btn primary" ${selected===null?'disabled':''} onclick="finishQuiz()">Testni yakunlash</button>`}
      </div>
    </div>
  </div>`;
  updateTimerDisplay();
}

function selectAnswer(i){
  state.answers[state.qIndex] = i;
  renderQuiz();
}
function nextQuestion(){
  state.qIndex++;
  renderQuiz();
}
function prevQuestion(){
  state.qIndex--;
  renderQuiz();
}

function finishQuiz(){
  clearInterval(state.timerHandle);
  const test = getTest(state.testId);
  let score = 0;
  test.questions.forEach((q,i)=>{ if(state.answers[i]===q.correct) score++; });
  const percent = Math.round((score/test.questions.length)*100);
  const passed = percent>=PASS_PERCENT;
  const dateStr = new Date().toLocaleDateString("uz-UZ", {year:"numeric",month:"long",day:"numeric"});
  const seconds = state.startedAt ? Math.round((Date.now() - state.startedAt)/1000) : 0;
  const xp = score*XP_PER_CORRECT + (passed ? XP_PASS_BONUS : 0) + (percent===100 ? XP_PERFECT_BONUS : 0);

  state.lastResult = {
    testId: test.id, title: test.title, score, total: test.questions.length,
    percent, passed, date: dateStr,
    seconds, xp,
    certId: passed ? certId(test.id) : null
  };
  currentAccount().results.push(state.lastResult);
  db.collection("accounts").doc(state.currentUser).update({
    results: firebase.firestore.FieldValue.arrayUnion(state.lastResult)
  }).catch(e=>console.error("Natijani saqlashda xatolik:", e));
  state.screen = "result";
  render();
}

function bestPerTest(results){
  const map = {};
  (results||[]).forEach(r=>{
    if(!map[r.testId] || r.percent > map[r.testId].percent) map[r.testId] = r;
  });
  return Object.values(map);
}

function userStats(acc){
  const all = acc.results || [];
  const bests = bestPerTest(all);
  const certCount = bests.filter(b=>b.passed).length;
  const avgPercent = bests.length ? Math.round(bests.reduce((s,b)=>s+b.percent,0)/bests.length) : 0;
  const totalXp = all.reduce((s,r)=>s+(r.xp||0), 0);
  const totalSeconds = all.reduce((s,r)=>s+(r.seconds||0), 0);
  return {certCount, avgPercent, attemptsCount:all.length, totalXp, totalSeconds};
}

  render();

}

async function submitReview(){
  if(!state.reviewStars){ alert("Iltimos, avval yulduzcha bilan baho bering."); return; }
  const ta = document.getElementById("reviewText");
  const text = ta ? ta.value.trim() : "";
  const r = state.lastResult;
  const acc = currentAccount();

  try{
    await db.collection("reviews").add({
      username: state.currentUser,
      fullName: acc.fullName,
      role: acc.role || null,
      testId: r.testId,
      testTitle: r.title,
      stars: state.reviewStars,
      text: text,
      percent: r.percent,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      dateLabel: r.date
    });
    state.reviewSubmitted = true;
    state.reviewDraft = "";
    render();
  }catch(e){
    console.error("Fikrni saqlashda xatolik:", e);
    alert("Fikrni yuborishda xatolik yuz berdi. Qaytadan urinib ko'ring.");
  }
}

async function fetchReviews(){
  try{
    const snap = await db.collection("reviews").orderBy("createdAt","desc").limit(100).get();
    return snap.docs.map(d=>d.data());
  }catch(e){
    // orderBy indeks talab qilsa yoki xato bo'lsa, oddiy o'qishga qaytamiz
    try{
      const snap = await db.collection("reviews").limit(100).get();
      return snap.docs.map(d=>d.data());
    }catch(e2){ console.error("Fikrlarni yuklashda xatolik:", e2); return []; }
  }
}

      <div>
        <h1>Reyting</h1>
        <div class="login-line">To'plangan XP bo'yicha · har to'g'ri javob ${XP_PER_CORRECT} XP, o'tgani uchun +${XP_PASS_BONUS}, 100% uchun +${XP_PERFECT_BONUS}</div>
      </div>
    </div>
    ${html}
  </div>`;
}

function renderCertificatesPage(){
  const passedResults = currentResults().filter(r=>r.passed);
  const html = passedResults.length
    ? `<div class="certs-page-grid">` + passedResults.slice().reverse().map(r=>`
        <div class="cert-row">
          <div>
            <div>${r.title}</div>
            <div class="sub">${r.date} · ${r.percent}%</div>
          </div>
          <button class="btn brass" onclick="viewCertificate('${r.testId}','${r.certId}')">Sertifikatni ko'rish</button>
        </div>`).join("") + `</div>`
    : `<div class="empty-note">Hozircha sertifikat yo'q. Test topshirib 70% va undan yuqori natija bilan yakunlang, sertifikat shu yerda paydo bo'ladi.</div>`;

  app.innerHTML = `
  <div class="screen profile-wrap">
    <div class="profile-head">
      <div>
        <h1>Sertifikatlarim</h1>
        <div class="login-line">${passedResults.length} ta rasmiy sertifikat</div>
      </div>
    </div>
    ${html}
  </div>`;
}

function renderProfile(){
  const acc = currentAccount();
  const results = currentResults();
  const passedResults = results.filter(r=>r.passed);
  const avg = results.length ? Math.round(results.reduce((s,r)=>s+r.percent,0)/results.length) : 0;

  const certsHtml = passedResults.length
    ? passedResults.slice().reverse().map(r=>`
        <div class="cert-row">
          <div>
            <div>${r.title}</div>
            <div class="sub">${r.date} · ${r.percent}%</div>
          </div>
          <button class="btn brass" onclick="viewCertificate('${r.testId}','${r.certId}')">Sertifikatni ko'rish</button>
        </div>`).join("")
    : `<div class="empty-note">Hozircha sertifikat yo'q. 70% va undan yuqori natija bilan testni yakunlang.</div>`;

  app.innerHTML = `
  <div class="screen profile-wrap">
    <div class="profile-head">
      <div>
        <h1>${acc.fullName} ${acc.role ? `<span class="role-badge" style="background:${roleColor(acc.role)}">${roleLabel(acc.role)}</span>` : ""}</h1>
        <div class="login-line">Login: ${state.currentUser}</div>
      </div>
      <button class="btn" onclick="logout()">Chiqish</button>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="n">${userStats(acc).totalXp}</div><div class="l">Jami XP</div></div>
      <div class="stat-box"><div class="n">${results.length}</div><div class="l">Jami urinish</div></div>
      <div class="stat-box"><div class="n">${passedResults.length}</div><div class="l">Muvaffaqiyatli</div></div>
      <div class="stat-box"><div class="n">${avg}%</div><div class="l">O'rtacha ball</div></div>
      <div class="stat-box"><div class="n" style="font-size:17px;">${formatDuration(userStats(acc).totalSeconds)}</div><div class="l">Sarflangan vaqt</div></div>
    </div>

    <div class="profile-card">
      <h3>Mening sertifikatlarim</h3>
      ${certsHtml}
    </div>

    <div class="profile-card">
      <h3>Ism-familiya</h3>
      ${state.profileMsg ? `<div class="profile-msg ${state.profileMsg.ok?'ok':'err'}">${state.profileMsg.text}</div>` : ""}
      <div class="field">
        <input id="pf_fullname" type="text" value="${acc.fullName}">
      </div>
      <button class="btn primary" onclick="saveProfileName()">Saqlash</button>
    </div>

    <div class="profile-card">
      <h3>Parolni almashtirish</h3>
      ${state.pwMsg ? `<div class="profile-msg ${state.pwMsg.ok?'ok':'err'}">${state.pwMsg.text}</div>` : ""}
      <div class="field">
        <label>Joriy parol</label>
        <div class="field-pw">
          <input id="pf_pw_old" type="password">
          <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('pf_pw_old', this)">${EYE_ICON}</button>
        </div>
      </div>
      <div class="field">
        <label>Yangi parol</label>
        <div class="field-pw">
          <input id="pf_pw_new" type="password" oninput="checkNewPasswordStrength()">
          <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('pf_pw_new', this)">${EYE_ICON}</button>
        </div>
        <div class="hint-line" id="pfPwHint"></div>
      </div>
      <div class="field">
        <label>Yangi parolni tasdiqlang</label>
        <div class="field-pw">
          <input id="pf_pw_new2" type="password">
          <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('pf_pw_new2', this)">${EYE_ICON}</button>
        </div>
      </div>
      <button class="btn primary" onclick="changePassword()">Parolni yangilash</button>
    </div>
  </div>`;
}

async function saveProfileName(){
  const val = document.getElementById("pf_fullname").value.trim();
  if(!val){ state.profileMsg = {ok:false, text:"Ism bo'sh bo'lishi mumkin emas."}; render(); return; }
  try{
    await db.collection("accounts").doc(state.currentUser).update({fullName: val});
    currentAccount().fullName = val;
    state.profileMsg = {ok:true, text:"Saqlandi."};
  }catch(e){
    state.profileMsg = {ok:false, text:"Saqlashda xatolik yuz berdi."};
  }
  render();
}

function checkNewPasswordStrength(){
  const el = document.getElementById("pfPwHint");
  const input = document.getElementById("pf_pw_new");
  if(!el || !input) return;
  const r = passwordStrength(input.value);
  el.textContent = r.label;
  el.className = "hint-line " + r.level;
}

async function changePassword(){
  const oldPw = document.getElementById("pf_pw_old").value;
  const newPw = document.getElementById("pf_pw_new").value;
  const newPw2 = document.getElementById("pf_pw_new2").value;

  const strength = passwordStrength(newPw);
  if(strength.level==="weak"){ state.pwMsg = {ok:false, text: strength.label || "Juda oson — yana urinib ko'ring."}; render(); return; }
  if(newPw!==newPw2){ state.pwMsg = {ok:false, text:"Yangi parollar mos kelmadi."}; render(); return; }

  try{
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPw);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPw);
    state.pwMsg = {ok:true, text:"Parol muvaffaqiyatli yangilandi."};
  }catch(e){
    state.pwMsg = {ok:false, text: e.code==="auth/wrong-password" ? "Joriy parol noto'g'ri." : "Xatolik yuz berdi. Qaytadan urinib ko'ring."};
  }
  render();
}

function goCertificate(){
  state._certId = null;
  state.userName = null;
  state.screen = "certificate";
  render();
}

function viewCertificate(testId, certIdVal){
  const r = currentResults().find(x=>x.testId===testId && x.certId===certIdVal);
  if(!r) return;
  state.lastResult = r;
  state._certId = null;
  state.userName = null;
  state.screen = "certificate";
  render();
}

function goHome(){
  clearInterval(state.timerHandle);
  state.screen = "home";
  state.testStats = null;
  render();
}

function certId(testId){
  return "BS-" + testId.toUpperCase() + "-" + Math.floor(100000+Math.random()*899999);
}

function renderCertificate(){
  const r = state.lastResult;
  if(!state._certId) state._certId = r.certId || certId(r.testId);
  if(!state.userName) state.userName = currentAccount().fullName;
  const nameDisplay = state.userName || "___________________";

  app.innerHTML = `
  <div class="screen cert-wrap">
    <div class="section-head">
      <h2>Sertifikatingiz</h2>
      <span>${r.title}</span>
    </div>
    <div class="cert-form">
      <input id="nameInput" type="text" placeholder="To'liq ismingizni kiriting (masalan: Aliyev Sardor)" value="${state.userName}" oninput="updateName(this.value)">
    </div>

    <div class="certificate" id="certificateNode">
      <div class="certificate-inner">
        <div class="cert-eyebrow">Bilim Sinovi platformasi</div>
        <div class="cert-title">Sertifikat</div>
        <div class="cert-sub">Ushbu sertifikat quyidagi shaxsga beriladi:</div>
        <div class="cert-name" id="certName">${nameDisplay}</div>
        <div class="cert-body">
          <b>${r.title}</b> testini muvaffaqiyatli topshirgani va <b>${r.percent}%</b> (${r.score}/${r.total} to'g'ri javob) natija ko'rsatgani uchun ushbu sertifikat bilan taqdirlanadi.
        </div>
        <div class="cert-footer">
          <svg class="cert-seal" width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="#A9822C" stroke-width="2"/>
            <circle cx="32" cy="32" r="19" fill="none" stroke="#A9822C" stroke-width="1"/>
            <text x="32" y="37" text-anchor="middle" font-family="Fraunces, serif" font-size="15" fill="#A9822C" font-weight="600">BS</text>
          </svg>
          <div class="cert-id">Sertifikat raqami<br>${state._certId}</div>
          <div class="cert-date">Berilgan sana<br>${r.date}</div>
        </div>
      </div>
    </div>

    <div class="cert-actions">
      <button class="btn primary" onclick="downloadCertificate()">Rasm sifatida yuklab olish</button>
      <button class="btn" onclick="window.print()">Chop etish</button>
      <button class="btn-ghost" onclick="goHome()" style="align-self:center;">Bosh sahifaga qaytish</button>
    </div>
  </div>`;
}

function updateName(v){
  state.userName = v;
  const el = document.getElementById("certName");
  if(el) el.textContent = v || "___________________";
}

function downloadCertificate(){
  const node = document.getElementById("certificateNode");
  if(!window.html2canvas){ alert("Yuklab olish vositasi hozircha yuklanmoqda, birozdan so'ng qayta urinib ko'ring."); return; }
  html2canvas(node, {backgroundColor:"#F7F2E7", scale:2}).then(canvas=>{
    const link = document.createElement("a");
    link.download = "sertifikat-" + (state.lastResult ? state.lastResult.testId : "bs") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

(async function bootstrap(){
  applyTheme(await loadTheme());
  init();
})();
</script>
</body>
</html>
